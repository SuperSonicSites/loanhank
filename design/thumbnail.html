<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LoanHank</title>
<link rel="stylesheet" href="styles.css">
<style>
body{margin:0;width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:1;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center}
.wm{font-family:var(--font-ui);font-weight:900;font-size:150px;letter-spacing:-0.02em;color:var(--ink);line-height:1}
.ruleline{width:760px;height:6px;background:var(--rule);margin-top:24px}
.strip{width:320px;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="main"><div class="wm">LOANHANK</div><div class="ruleline"></div></div>
<div class="strip"><div style="background:#F2E4C2"></div><div style="background:#E4EDDC"></div><div style="background:#3F7A34"></div><div style="background:#2F5D8A"></div></div>
</body>
</html>
